<script>
const products=[
{id:1,brand:"Emporio Armani",name:"Stronger With You",notes:"Warm · Sweet · Vanilla",image:"73bfcb46ab4837ac2a4eaf88412e3325.jpg",badge:"Best Seller",prices:{"5ml":70,"10ml":130}},
{id:2,brand:"Donna Born in Roma",name:"Valentino",notes:"Fresh · Aromatic · Woody",image:"816eb3374d37a57960a9290b14d3ae68.jpg",badge:"Popular",prices:{"5ml":70,"10ml":135}},
{id:3,brand:"Jean Paul Gaultier",name:"Le Male Elixir",notes:"Sweet · Amber · Vanilla",image:"c92071558e4acf4839eda4939f2bd48f.jpg",badge:"New",prices:{"5ml":65,"10ml":120}},
{id:4,brand:"Dior",name:"Sauvage",notes:"Spicy · Woody · Powerful",image:"9a351959466a0946f8b1b9abec7fc651.jpg",badge:"Iconic",prices:{"5ml":69,"10ml":119}},
{id:5,brand:"Donna Born in Roma",name:"Valentino",notes:"Floral . Sweet . Woody . Vanilla",image:"8fc582660e30d818b59c523560d8d813.jpg",badge:"Luxury",prices:{"5ml":70,"10ml":130}},
{id:6,brand:"Tom Ford",name:"Oud Wood",notes:"Woody · Oud · Spicy",image:"https://images.unsplash.com/photo-1557170334-a9632e77c6e4?auto=format&fit=crop&w=700&q=85",badge:"Premium",prices:{"5ml":85,"10ml":160}},
{id:7,brand:"Afnan",name:"9PM",notes:"Sweet · Fruity · Amber",image:"https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?auto=format&fit=crop&w=700&q=85",badge:"Hot",prices:{"5ml":45,"10ml":80}},
{id:8,brand:"Yves Saint Laurent",name:"Y EDP",notes:"Fresh · Woody · Aromatic",image:"https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=700&q=85",badge:"Classic",prices:{"5ml":55,"10ml":100}}
];

let cart=[];
let selectedSizes={};

function displayProducts(list=products){
const container=document.getElementById("products");
container.innerHTML="";

if(list.length===0){
container.innerHTML='<p style="grid-column:1/-1;text-align:center;color:#888;padding:50px;">Aucun parfum trouvé.</p>';
return;
}

list.forEach(product=>{
const selected=selectedSizes[product.id]||"5ml";

container.innerHTML+=`
<div class="product">
<div class="product-image">
${product.badge?`<div class="badge">${product.badge}</div>`:""}
<img src="${product.image}" alt="${product.brand} ${product.name}">
</div>

<div class="product-info">
<div class="brand">${product.brand}</div>
<div class="product-name">${product.name}</div>
<div class="notes">${product.notes}</div>

<div class="sizes">
${Object.keys(product.prices).map(size=>
`<button class="size ${selected===size?"active":""}" onclick="selectSize(${product.id},'${size}')">${size}</button>`
).join("")}
</div>

<div class="product-bottom">
<div class="price">${product.prices[selected]} DH</div>
<button class="add-btn" onclick="addToCart(${product.id})">Ajouter</button>
</div>
</div>
</div>`;
});
}

function selectSize(id,size){
selectedSizes[id]=size;
displayProducts();
}

function addToCart(id){
const product=products.find(p=>p.id===id);
const size=selectedSizes[id]||"5ml";

const existing=cart.find(item=>item.id===id&&item.size===size);

if(existing){
existing.quantity++;
}else{
cart.push({
id:id,
size:size,
quantity:1
});
}

updateCart();
openCart();
}

function updateCart(){
const count=cart.reduce((sum,item)=>sum+item.quantity,0);

document.getElementById("cartCount").textContent=count;

const container=document.getElementById("cartItems");

if(cart.length===0){
container.innerHTML='<div class="empty">Votre panier est vide.</div>';
document.getElementById("cartTotal").textContent="0 DH";
return;
}

let total=0;

container.innerHTML=cart.map((item,index)=>{
const product=products.find(p=>p.id===item.id);
const price=product.prices[item.size];

total+=price*item.quantity;

return `
<div class="cart-item">
<img src="${product.image}" alt="${product.name}">

<div class="cart-item-info">
<div class="cart-item-name">${product.name}</div>
<div class="cart-item-size">${item.size} · Quantité ${item.quantity}</div>
<div class="cart-item-price">${price*item.quantity} DH</div>
</div>

<button class="remove" onclick="removeItem(${index})">Supprimer</button>
</div>`;
}).join("");

document.getElementById("cartTotal").textContent=total+" DH";
}

function removeItem(index){
cart.splice(index,1);
updateCart();
}

function openCart(){
document.getElementById("cartOverlay").classList.add("open");
document.body.style.overflow="hidden";
}

function closeCart(){
document.getElementById("cartOverlay").classList.remove("open");
document.body.style.overflow="";
}

function closeCartOutside(event){
if(event.target.id==="cartOverlay"){
closeCart();
}
}

function searchProducts(){
const query=document.getElementById("searchInput").value.toLowerCase().trim();

const filtered=products.filter(product=>
product.name.toLowerCase().includes(query)||
product.brand.toLowerCase().includes(query)||
product.notes.toLowerCase().includes(query)
);

displayProducts(filtered);
}

function showAll(){
document.getElementById("searchInput").value="";
displayProducts();
}

function focusSearch(){
document.getElementById("shop").scrollIntoView();

setTimeout(()=>{
document.getElementById("searchInput").focus();
},400);
}

function orderWhatsApp(){
if(cart.length===0){
alert("Votre panier est vide.");
return;
}

let message="Bonjour GHIMED FRAGRANCES 👋\n\nJe souhaite commander :\n\n";
let total=0;

cart.forEach(item=>{
const product=products.find(p=>p.id===item.id);
const price=product.prices[item.size];

total+=price*item.quantity;

message+="• "+product.name+" — "+item.size+" × "+item.quantity+" — "+(price*item.quantity)+" DH\n";
});

message+="\n💰 Total : "+total+" DH\n\n📍 Ville :\n📞 Téléphone :";

window.open(
"https://wa.me/212708773218?text="+encodeURIComponent(message),
"_blank"
);
}

displayProducts();
updateCart();
</script>
